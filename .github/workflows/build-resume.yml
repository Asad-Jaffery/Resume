name: Build Resume PDF

on:
  push:
    paths:
      - 'resumes/**.tex'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: resumes
          root_file: "*.tex"
          glob_root_file: true

      - name: Commit compiled PDFs back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build resume PDFs [skip ci]"
          file_pattern: resumes/*.pdf
